name: Northstar Paper Ledger Snapshots

on:
  schedule:
    # Collect a read-only broker snapshot and reconcile it every three hours.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northstar-paper-ledger-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify required operator secret
        env:
          OPERATOR_TOKEN: ${{ secrets.NORTHSTAR_OPERATOR_TOKEN }}
        run: |
          if [ -z "$OPERATOR_TOKEN" ]; then
            echo "::error::Repository secret NORTHSTAR_OPERATOR_TOKEN is not configured."
            exit 1
          fi

      - name: Run read-only account sync, fill import, and reconciliation
        env:
          OPERATOR_TOKEN: ${{ secrets.NORTHSTAR_OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          base="https://ai-stock-advisor.pages.dev/api/paper"
          headers=(-H "Authorization: Bearer $OPERATOR_TOKEN" -H "Accept: application/json")

          sync="$(curl --fail --silent --show-error --max-time 30 -X POST "${headers[@]}" \
            -H "X-Request-ID: northstar-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$base/sync")"
          echo "$sync" | jq -e '.ok == true and .synced == true and .execution == false' >/dev/null
          echo "$sync" | jq '{ok, synced, execution, mode, capturedAt, snapshot}'

          fills="$(curl --silent --show-error --max-time 45 -X POST "${headers[@]}" \
            -H "X-Request-ID: northstar-fills-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$base/fills-sync")"
          fills_ok="$(echo "$fills" | jq -r '.ok == true and .imported == true and .execution == false')"
          fills_safe="$(echo "$fills" | jq -r '.safeToContinue == true and .requiresManualRecovery == false')"
          echo "$fills" | jq '{ok, imported, execution, safeToContinue, requiresManualRecovery, status, unsafeExposureCount, brokerRecords, newRecords, alreadyKnown, orderRowsUpdated, skippedLifecycleCount, checkedAt}'

          # Always run reconciliation after a completed fill import, even when the
          # importer has raised a manual-recovery condition. The final job must fail
          # unless both lifecycle safety and read-only reconciliation are clean.
          reconcile="$(curl --silent --show-error --max-time 45 -X POST "${headers[@]}" \
            -H "X-Request-ID: northstar-reconcile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$base/reconcile")"
          reconcile_ok="$(echo "$reconcile" | jq -r '.ok == true and .reconciled == true and .execution == false and .status == "RECONCILIATION_PASSED_READ_ONLY"')"
          echo "$reconcile" | jq '{ok, reconciled, execution, status, counts, checkedAt}'

          if [ "$fills_ok" != "true" ] || [ "$fills_safe" != "true" ] || [ "$reconcile_ok" != "true" ]; then
            echo "::error::Paper ledger maintenance detected an unsafe lifecycle state or reconciliation mismatch."
            exit 1
          fi
