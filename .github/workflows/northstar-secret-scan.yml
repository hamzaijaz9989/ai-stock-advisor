name: Northstar full-history secret scan

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "security/full-history-secret-scan"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northstar-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan complete Git history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out all branches and complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan all reachable Git refs and their history
        uses: gitleaks/gitleaks-action@v2
        with:
          args: git . --log-opts="--all --full-history" --redact --exit-code=2 --report-format=sarif --report-path=results.sarif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
