name: Northstar full-history secret scan

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "security/full-history-secret-scan"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northstar-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan complete Git history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out all branches and complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks release
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks version

      - name: Scan every reachable ref and complete Git history
        run: |
          set -euo pipefail
          /tmp/gitleaks/gitleaks git . \
            --config .gitleaks.toml \\
            --log-opts="--all --full-history" \
            --redact \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif

      - name: Upload redacted scan report
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: northstar-gitleaks-sarif
          path: results.sarif
          if-no-files-found: ignore
