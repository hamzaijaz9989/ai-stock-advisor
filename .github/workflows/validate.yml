name: Validate AI Stock Advisor

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend and Pages Function JavaScript syntax
        shell: bash
        run: |
          node --check web/app.js
          for file in web/functions/api/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Run frontend analysis logic tests
        run: node --test tests/web_logic.test.mjs tests/fmp_endpoint.test.mjs tests/ai_research.test.mjs tests/fmp_history.test.mjs
      - name: Test SEC point-in-time ingestion adapter
        run: pytest tests/test_sec_ingest.py
      - name: Smoke-test SEC ingestion CLI argument validation
        run: python scripts/fetch_sec_history.py --help
      - name: Smoke-test point-in-time validation CLI with synthetic fixture
        run: |
          python scripts/run_strategy_validation.py --input examples/strategy_validation_input.example.json --output /tmp/northstar-validation-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/northstar-validation-smoke.json").read_text())
          assert report["signals_generated"] == 1
          assert report["portfolio_simulation"]["completed_positions"] == 1
          assert report["validation"]["strategy_validation_passed"] is False
          assert report["validation"]["decision_eligible"] is False
          PY
