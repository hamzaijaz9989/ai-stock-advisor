name: Validate AI Stock Advisor

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend and Pages Function JavaScript syntax
        shell: bash
        run: |
          node --check web/app.js
          for file in web/functions/api/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Run frontend analysis logic tests
        run: node --test tests/web_logic.test.mjs
