name: Northstar scheduled scan health monitor

on:
  schedule:
    # Run 30 minutes after the three-hourly stock scan to allow for completion.
    - cron: "37 */3 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/verify-stock-cache.mjs"
      - ".github/workflows/northstar-operations.yml"
      - "web/data/top-stocks-cache.json"

permissions:
  contents: read

concurrency:
  group: northstar-scan-health
  cancel-in-progress: true

jobs:
  verify-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify scheduled scan freshness and data integrity
        run: node scripts/verify-stock-cache.mjs
