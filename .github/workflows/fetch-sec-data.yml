name: Fetch SEC historical source bundle

on:
  push:
    branches:
      - fix/sec-acceptance-timestamp-provenance
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated US stock tickers (maximum 10)"
        required: true
        default: "AAPL MSFT NVDA AMZN GOOGL"
        type: string
      cutoff_date:
        description: "Latest filing date to include (YYYY-MM-DD; blank means today UTC)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  fetch-sec-source-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Northstar data tools
        run: python -m pip install -e .
      - name: Validate inputs and fetch SEC data
        env:
          SYMBOLS_INPUT: ${{ inputs.symbols || 'AAPL MSFT NVDA AMZN GOOGL' }}
          CUTOFF_INPUT: ${{ inputs.cutoff_date || '' }}
          SEC_USER_AGENT: "NorthstarAI research contact: ihamzaij681@gmail.com"
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$SYMBOLS_INPUT" =~ ^[A-Za-z0-9.-]+([[:space:]]+[A-Za-z0-9.-]+){0,9}$ ]]; then
            echo "Provide 1–10 space-separated ticker symbols." >&2
            exit 2
          fi
          read -r -a symbols <<< "$SYMBOLS_INPUT"
          for symbol in "${symbols[@]}"; do
            if ! [[ "$symbol" =~ ^[A-Za-z][A-Za-z0-9.-]{0,9}$ ]]; then
              echo "Invalid ticker syntax: $symbol" >&2
              exit 2
            fi
          done
          cutoff="$CUTOFF_INPUT"
          if [[ -z "$cutoff" ]]; then
            cutoff="$(date -u +%F)"
          fi
          python -c 'from datetime import date; date.fromisoformat(__import__("sys").argv[1])' "$cutoff"
          python scripts/fetch_sec_history.py --symbols "${symbols[@]}" --cutoff "$cutoff" --output sec-source-bundle.json
          echo "SEC_CUTOFF_DATE=$cutoff" >> "$GITHUB_ENV"
      - name: Upload private-run source bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: northstar-sec-source-${{ github.run_id }}
          path: sec-source-bundle.json
          if-no-files-found: error
          retention-days: 7
