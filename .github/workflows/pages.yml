name: Deploy AI Stock Advisor to GitHub Pages

# Kept only for historical/manual use. The active deployment target is Cloudflare Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./web"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
