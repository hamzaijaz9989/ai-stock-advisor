name: Northstar read-only paper ledger snapshots

on:
  schedule:
    # Collect a real broker equity point every three hours.
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/northstar-equity-snapshot.yml"

permissions:
  contents: read

concurrency:
  group: northstar-read-only-equity-snapshots
  cancel-in-progress: false

jobs:
  snapshot-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production policy remains fail-closed
        run: |
          set -euo pipefail
          readiness="$(curl --fail --silent --show-error --max-time 20 "https://ai-stock-advisor.pages.dev/api/paper/readiness")"
          echo "$readiness" | jq -e '.configured == true and .policyVerified == true and .mode == "paper"' >/dev/null
          echo "$readiness" | jq '{configured, policyVerified, mode, executionEnabled, killSwitchEngaged, limits, checkedAt}'

      - name: Verify operator secret is present without exposing it
        env:
          OPERATOR_TOKEN: ${{ secrets.NORTHSTAR_OPERATOR_TOKEN }}
        run: |
          if [ -z "$OPERATOR_TOKEN" ]; then
            echo "::error::Repository secret NORTHSTAR_OPERATOR_TOKEN is missing or empty."
            exit 1
          fi

      - name: Capture a read-only Alpaca Paper equity and position snapshot
        env:
          OPERATOR_TOKEN: ${{ secrets.NORTHSTAR_OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          base="https://ai-stock-advisor.pages.dev/api/paper"
          sync="$(curl --fail --silent --show-error --max-time 30 -X POST \
            -H "Authorization: Bearer $OPERATOR_TOKEN" \
            -H "X-Request-ID: northstar-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -H "Accept: application/json" "$base/sync")"
          echo "$sync" | jq -e '.ok == true and .synced == true and .execution == false and .mode == "paper"' >/dev/null
          echo "$sync" | jq '{ok, synced, execution, mode, capturedAt, snapshot}'

      - name: Import broker fills without submitting or changing orders
        id: fills
        env:
          OPERATOR_TOKEN: ${{ secrets.NORTHSTAR_OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          base="https://ai-stock-advisor.pages.dev/api/paper"
          fills="$(curl --fail --silent --show-error --max-time 45 -X POST \
            -H "Authorization: Bearer $OPERATOR_TOKEN" \
            -H "X-Request-ID: northstar-fills-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -H "Accept: application/json" "$base/fills-sync")"
          fills_ok="$(echo "$fills" | jq -r '.ok == true and .imported == true and .execution == false')"
          fills_safe="$(echo "$fills" | jq -r '.safeToContinue == true and .requiresManualRecovery == false')"
          echo "$fills" | jq '{ok, imported, execution, safeToContinue, requiresManualRecovery, status, unsafeExposureCount, unsafeOrderCount, brokerRecords, newRecords, alreadyKnown, orderRowsUpdated, skippedLifecycleCount, checkedAt}'
          if [ "$fills_ok" != "true" ] || [ "$fills_safe" != "true" ]; then
            echo "::error::Fill import is incomplete or reports unsafe exposure; stop before reconciliation and require operator review."
            exit 1
          fi

      - name: Run read-only broker-to-ledger reconciliation
        env:
          OPERATOR_TOKEN: ${{ secrets.NORTHSTAR_OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          base="https://ai-stock-advisor.pages.dev/api/paper"
          reconcile="$(curl --silent --show-error --max-time 45 -X POST \
            -H "Authorization: Bearer $OPERATOR_TOKEN" \
            -H "X-Request-ID: northstar-reconcile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -H "Accept: application/json" "$base/reconcile")"
          reconcile_ok="$(echo "$reconcile" | jq -r '.ok == true and .reconciled == true and .execution == false and .status == "RECONCILIATION_PASSED_READ_ONLY"')"
          echo "$reconcile" | jq '{ok, reconciled, execution, status, counts, checkedAt}'
          if [ "$reconcile_ok" != "true" ]; then
            echo "::error::Read-only broker-to-ledger reconciliation did not pass."
            exit 1
          fi
