name: Northstar read-only paper equity snapshots

on:
  schedule:
    # Collect a real broker equity point every three hours.
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/northstar-equity-snapshot.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: northstar-read-only-equity-snapshots
  cancel-in-progress: false

jobs:
  snapshot-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify production policy remains fail-closed
        run: |
          set -euo pipefail
          readiness="$(curl --fail --silent --show-error --max-time 20 "https://ai-stock-advisor.pages.dev/api/paper/readiness")"
          echo "$readiness" | jq -e '.configured == true and .policyVerified == true and .mode == "paper" and .executionEnabled == false and .killSwitchEngaged == true' >/dev/null
          echo "$readiness" | jq '{configured, policyVerified, mode, executionEnabled, killSwitchEngaged, limits, checkedAt}'

      - name: Request short-lived GitHub OIDC token and run read-only snapshot chain
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fai-stock-advisor.pages.dev"
          oidc_token="$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$token_url" | jq -er '.value')"
          response="$(curl --fail --silent --show-error --max-time 120 -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "X-Request-ID: northstar-equity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -H "Accept: application/json" \
            "https://ai-stock-advisor.pages.dev/api/paper/github-snapshot")"
          echo "$response" | jq '{ok, execution, mode, workflow, sync, fills, reconciliation, warnings}'
          echo "$response" | jq -e '.ok == true and .execution == false and .mode == "paper" and .sync.synced == true and .fills.imported == true and .reconciliation.reconciled == true and .reconciliation.status == "RECONCILIATION_PASSED_READ_ONLY"' >/dev/null
