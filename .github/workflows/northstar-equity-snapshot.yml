name: Northstar read-only paper equity snapshots

on:
  schedule:
    # Collect a real broker equity point every three hours.
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/northstar-equity-snapshot.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: northstar-read-only-equity-snapshots
  cancel-in-progress: false

jobs:
  snapshot-and-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify production policy remains fail-closed
        run: |
          set -euo pipefail
          readiness="$(curl --fail --silent --show-error --max-time 20 "https://ai-stock-advisor.pages.dev/api/paper/readiness")"
          echo "$readiness" | jq -e '.configured == true and .policyVerified == true and .mode == "paper" and .executionEnabled == false and .killSwitchEngaged == true' >/dev/null
          echo "$readiness" | jq '{configured, policyVerified, mode, executionEnabled, killSwitchEngaged, limits, checkedAt}'

      - name: Capture a read-only snapshot through pinned GitHub OIDC
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub OIDC token request context is unavailable."
            exit 1
          fi
          oidc_response="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --get --data-urlencode "audience=northstar-paper-snapshot" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          oidc_token="$(printf '%s' "$oidc_response" | jq -er '.value')"
          if [[ -z "$oidc_token" ]]; then
            echo "::error::GitHub OIDC token response was empty."
            exit 1
          fi
          base="https://ai-stock-advisor.pages.dev/api/paper"
          snapshot="$(curl --fail --silent --show-error --max-time 75 -X POST \
            -H "Authorization: Bearer $oidc_token" \
            -H "Accept: application/json" "$base/snapshot")"
          echo "$snapshot" | jq -e '.ok == true and .synced == true and .reconciled == true and .execution == false and .automatedOrderSubmission == false and .mode == "paper"' >/dev/null
          echo "$snapshot" | jq '{ok, synced, reconciled, replayed, execution, automatedOrderSubmission, mode, requestId, capturedAt, positionCount, checkedAt}'
