# Narrow, evidence-backed suppressions for historical generic-api-key false positives.
# Every entry is constrained by exact commit, path, rule ID, and source-line pattern.
# Never add broad path-only or rule-wide suppressions.

[[allowlists]]
description = "Synthetic operator bearer token in a test-only fixture; replaced with an inert sentinel in a later commit."
condition = "AND"
commits = ["106ea8d9367d72ce8b013488dca5b9d26d9d2905"]
paths = ['^tests/paper-intent-review\.test\.mjs$']
ruleIDs = ["generic-api-key"]
regexTarget = "line"
regexes = ['NORTHSTAR_OPERATOR_TOKEN:"operator-secret-[0-9]+"']

[[allowlists]]
description = "FMP environment binding identifiers, not credential values."
condition = "AND"
commits = ["cf74ef6b4947873dadb66ee8111ecfb2132ddaa3"]
paths = ['^web/functions/api/fmp-health\.js$']
ruleIDs = ["generic-api-key"]
regexTarget = "line"
regexes = ['const key = env\.FMP_API_KEY2 \|\| env\.FMP_API_KEY;']

