name = "ai-stock-advisor"
pages_build_output_dir = "."
compatibility_date = "2026-10-27"

# Production remains bound to the durable paper ledger.
[[d1_databases]]
binding = "NORTHSTAR_DB"
database_name = "northstar-paper-ledger"
database_id = "528f3a23-1d1f-4d16-8463-f643d85f5deb"
migrations_dir = "migrations"

# Preview must use its isolated database and must never inherit Production.
[[env.preview.d1_databases]]
binding = "NORTHSTAR_DB"
database_name = "northstar-preview"
database_id = "bdffc29f-a4f6-498e-ade7-22c85d9bd373"
migrations_dir = "migrations"

# Explicit Production override keeps the environment mapping unambiguous.
[[env.production.d1_databases]]
binding = "NORTHSTAR_DB"
database_name = "northstar-paper-ledger"
database_id = "528f3a23-1d1f-4d16-8463-f643d85f5deb"
migrations_dir = "migrations"
